name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Install package without resolving dependencies
        run: python -m pip install -e . --no-deps
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Scan fixtures for PII and secrets
        run: python scripts/check_fixtures_pii.py
      - name: Run offline tests
        run: pytest

  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install source distribution build tool
        run: python -m pip install build==1.5.0
      - name: Build source distribution from checkout
        run: python -m build --sdist
      - name: Build wheel from source distribution
        run: python -m pip wheel --no-deps --wheel-dir derived-wheel dist/*.tar.gz
      - name: Install sdist-derived wheel with runtime dependencies
        run: |
          python -m venv smoke-venv
          smoke-venv/bin/pip install derived-wheel/*.whl
      - name: Smoke test offline metadata commands
        run: |
          offline_guard="$(mktemp -d)"
          trap 'rm -rf "$offline_guard"' EXIT
          cat >"$offline_guard/sitecustomize.py" <<'PY'
          import socket

          def deny_network(*args, **kwargs):
              raise RuntimeError("offline smoke test blocked a socket connection")

          class OfflineSocket(socket.socket):
              connect = deny_network
              connect_ex = deny_network

          socket.create_connection = deny_network
          socket.socket = OfflineSocket
          socket.SocketType = OfflineSocket
          PY
          export PYTHONPATH="$offline_guard${PYTHONPATH:+:$PYTHONPATH}"
          smoke-venv/bin/agentic-blog --version
          smoke-venv/bin/agentic-blog --help
          smoke-venv/bin/agentic-blog catalog
          smoke-venv/bin/agentic-blog schema
          smoke-venv/bin/agentic-blog schema --json
